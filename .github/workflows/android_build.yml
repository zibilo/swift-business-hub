name: Build Windows App (EXE)
on:
  push:
    branches: [main, master]
  workflow_dispatch: # Permet de lancer le build manuellement depuis l'onglet Actions

jobs:
  build-windows:
    runs-on: windows-latest # Utilise un serveur Windows pour compiler le .exe
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Main Dependencies
        # Installe jspdf, jspdf-autotable, exceljs et les autres outils
        run: npm install --legacy-peer-deps

      - name: Build Web App (Vite)
        # Compile tout le code React + PDF + Excel en fichiers statiques
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Setup Capacitor Electron
        # Prépare l'environnement Electron pour Windows
        run: |
          npm install @capacitor-community/electron
          if (!(Test-Path electron)) {
            npx cap add @capacitor-community/electron
          }
          npx cap sync @capacitor-community/electron

      - name: Build EXE Software
        # Cette étape entre dans le dossier electron, installe ses outils et crée le .exe
        run: npm run windows:make
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload Windows Setup
        # Récupère le fichier .exe final et le met à disposition sur GitHub
        uses: actions/upload-artifact@v4
        with:
          name: MUCODEC-Windows-Installer
          path: electron/out/make/squirrel.windows/x64/*.exe
