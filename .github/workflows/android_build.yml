name: Build Windows App (EXE)
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        shell: pwsh
        run: |
          # Installation des dépendances de base
          npm install --legacy-peer-deps
          
          # Installation FORCÉE des modules requis pour le build Vite
          # On ajoute @capacitor-fingerprint-auth ici pour corriger l'erreur Rollup
          npm install @capacitor-fingerprint-auth jspdf jspdf-autotable exceljs file-saver --legacy-peer-deps

      - name: Build Web App (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Initialize Capacitor Electron
        shell: pwsh
        run: |
          npm install @capacitor-community/electron --legacy-peer-deps
          if (!(Test-Path "electron")) {
            npx cap add @capacitor-community/electron
          }

      - name: Patch Electron Files
        shell: pwsh
        run: |
          # Correction du package.json d'Electron
          $pkgPath = "electron/package.json"
          if (Test-Path $pkgPath) {
            $pkg = Get-Content $pkgPath | ConvertFrom-Json
            $pkg.name = "mucodec-espace-entreprise"
            $pkg.main = "build/index.js" 
            $pkg.scripts."electron:make" = "electron-builder build -c ./electron-builder.config.json -p never"
            $pkg | ConvertTo-Json | Set-Content $pkgPath
          }

          # Patch du TSConfig d'Electron
          $tsconfig = @"
          {
            "compilerOptions": {
              "target": "ESNext",
              "module": "CommonJS",
              "allowJs": true,
              "skipLibCheck": true,
              "esModuleInterop": true,
              "outDir": "build",
              "rootDir": "src",
              "moduleResolution": "node",
              "resolveJsonModule": true,
              "strict": false
            },
            "include": ["src/**/*.ts"],
            "exclude": ["node_modules"]
          }
          "@
          $tsconfig | Set-Content -Path "electron/tsconfig.json"

      - name: Build and Sync Electron
        shell: pwsh
        run: |
          cd electron
          npm install --legacy-peer-deps
          npm install @types/node@20 --save-dev
          
          cd ..
          npx cap sync @capacitor-community/electron
          
          cd electron
          Write-Host "Compiling TypeScript for Electron..."
          npx tsc --skipLibCheck
          
          if (Test-Path "build/index.js") {
            Write-Host "Starting Electron Builder..."
            npm run electron:make
          } else {
            Write-Error "Critical: index.js not found in build folder."
            exit 1
          }
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: MUCODEC-Windows-Installer
          path: electron/dist/*.exe
