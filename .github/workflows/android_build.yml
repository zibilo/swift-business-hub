name: Build Windows App (EXE)
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install jspdf jspdf-autotable exceljs file-saver --legacy-peer-deps

      - name: Build Web App (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Initialize Capacitor Electron
        run: |
          npm install @capacitor-community/electron
          if (!(Test-Path "electron")) {
            npx cap add @capacitor-community/electron
          }

      - name: Force Patch TSConfig
        # On ecrase le fichier par une version propre pour eviter les erreurs de parsing
        shell: pwsh
        run: |
          $tsconfig = @"
          {
            "compilerOptions": {
              "target": "ESNext",
              "module": "CommonJS",
              "allowJs": true,
              "skipLibCheck": true,
              "esModuleInterop": true,
              "noImplicitAny": false,
              "sourceMap": false,
              "outDir": "dist",
              "moduleResolution": "node",
              "resolveJsonModule": true,
              "strict": false
            },
            "include": ["src/**/*.ts", "src/**/*.js"],
            "exclude": ["node_modules"]
          }
          "@
          $tsconfig | Set-Content -Path "electron/tsconfig.json"
          Write-Host "TSConfig forced with skipLibCheck: true"

      - name: Build and Sync Electron
        shell: pwsh
        run: |
          # Installation des dependances dans le dossier electron
          cd electron
          npm install --legacy-peer-deps
          npm install @types/node@20 --save-dev
          
          # Synchronisation des fichiers web vers Electron
          cd ..
          npx cap sync @capacitor-community/electron
          
          # Compilation et creation du .exe
          cd electron
          npx tsc --skipLibCheck || echo "Warnings ignored"
          npm run electron:make
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: MUCODEC-Windows-Installer
          path: |
            electron/out/make/*.exe
            electron/out/make/squirrel.windows/x64/*.exe
