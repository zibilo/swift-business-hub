name: Build Windows App (EXE)
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Main Dependencies
        # On force l'installation des libs de rapport qui causent l'erreur de résolution
        run: |
          npm install --legacy-peer-deps
          npm install jspdf jspdf-autotable exceljs file-saver --legacy-peer-deps

      - name: Build Web App (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Initialize Capacitor Electron
        run: |
          npx cap add @capacitor-community/electron

      - name: Patch Electron TypeScript Config
        shell: pwsh
        run: |
          $path = "electron/tsconfig.json"
          if (Test-Path $path) {
            $config = Get-Content $path | ConvertFrom-Json
            $config.compilerOptions.skipLibCheck = $true
            $config.compilerOptions.strict = $false
            $config | ConvertTo-Json | Set-Content $path
            Write-Host "TSConfig patched successfully."
          }

      - name: Build EXE Software
        run: npm run windows:make
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: MUCODEC-Windows-Installer
          path: |
            electron/out/make/*.exe
            electron/out/make/squirrel.windows/x64/*.exe
