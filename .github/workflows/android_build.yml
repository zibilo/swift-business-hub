name: Build Windows App (EXE)
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install jspdf jspdf-autotable exceljs file-saver --legacy-peer-deps

      - name: Build Web App (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Initialize Capacitor Electron
        run: |
          npm install @capacitor-community/electron
          if (!(Test-Path "electron")) {
            npx cap add @capacitor-community/electron
          }

      - name: Patch Electron Files (Name, Repo & Config)
        shell: pwsh
        run: |
          $pkgPath = "electron/package.json"
          if (Test-Path $pkgPath) {
            $pkg = Get-Content $pkgPath | ConvertFrom-Json
            
            # 1. Correction du nom (pas d'espaces)
            $pkg.name = "mucodec-espace-entreprise"
            
            # 2. Ajout de l'URL du dépôt (requis par electron-builder)
            $pkg.repository = "https://github.com/${{ github.repository }}"
            
            # 3. Modification du script de build pour éviter l'erreur de publication (-p never)
            $pkg.scripts."electron:make" = "npm run build && electron-builder build -c ./electron-builder.config.json -p never"
            
            $pkg | ConvertTo-Json | Set-Content $pkgPath
            Write-Host "Fixed package.json: Name, Repo and Build script updated."
          }

          # 4. Patch du TSConfig
          $tsconfig = @"
          {
            "compilerOptions": {
              "target": "ESNext",
              "module": "CommonJS",
              "allowJs": true,
              "skipLibCheck": true,
              "esModuleInterop": true,
              "noImplicitAny": false,
              "sourceMap": false,
              "outDir": "dist",
              "moduleResolution": "node",
              "resolveJsonModule": true,
              "strict": false
            },
            "include": ["src/**/*.ts", "src/**/*.js"],
            "exclude": ["node_modules"]
          }
          "@
          $tsconfig | Set-Content -Path "electron/tsconfig.json"
          Write-Host "TSConfig patched."

      - name: Build and Sync Electron
        shell: pwsh
        run: |
          cd electron
          npm install --legacy-peer-deps
          npm install @types/node@20 --save-dev
          
          cd ..
          npx cap sync @capacitor-community/electron
          
          cd electron
          npx tsc --skipLibCheck || echo "Warnings ignored"
          # Utilise le script patché avec -p never
          npm run electron:make
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: MUCODEC-Windows-Installer
          path: |
            electron/dist/*.exe
            electron/out/make/*.exe
            electron/out/make/squirrel.windows/x64/*.exe
