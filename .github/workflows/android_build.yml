name: Build Windows App (EXE)
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install jspdf jspdf-autotable exceljs file-saver --legacy-peer-deps

      - name: Build Web App (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Setup Capacitor Electron
        run: |
          # Installation du module si absent et création du dossier
          npm install @capacitor-community/electron
          npx cap add @capacitor-community/electron

      - name: Patch and Build Electron
        shell: pwsh
        run: |
          # 1. Correction du tsconfig dans le dossier généré
          $path = "electron/tsconfig.json"
          if (Test-Path $path) {
            $config = Get-Content $path | ConvertFrom-Json
            $config.compilerOptions.skipLibCheck = $true
            $config.compilerOptions.strict = $false
            $config | ConvertTo-Json | Set-Content $path
          }

          # 2. Installation des dépendances INTERNES à Electron
          cd electron
          npm install --legacy-peer-deps
          npm install @types/node@20 --save-dev

          # 3. Synchronisation Capacitor
          cd ..
          npx cap sync @capacitor-community/electron

          # 4. Lancement du build final du .exe (Commande directe)
          cd electron
          npx tsc --skipLibCheck || echo "Warnings ignored"
          npm run electron:make
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: MUCODEC-Windows-Installer
          path: |
            electron/out/make/*.exe
            electron/out/make/squirrel.windows/x64/*.exe
