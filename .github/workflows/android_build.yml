name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Install All Dependencies
        run: |
          npm install --legacy-peer-deps
          # Installation des bibliothèques spécifiques pour MUCODEC
          # On utilise capacitor-native-biometric (le plus stable pour Cap 6)
          npm install capacitor-native-biometric@latest --legacy-peer-deps
          npm install vite-plugin-pwa -D --legacy-peer-deps
          npm install jspdf jspdf-autotable exceljs file-saver --legacy-peer-deps

      - name: Build Web App (Vite)
        # Génère le code React + le cache hors-ligne (PWA)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Initialize Capacitor Android
        # Crée le dossier android s'il n'est pas présent dans votre dépôt
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        # Copie les fichiers Web et lie les plugins natifs (Biométrie)
        run: npx cap sync android

      - name: Patch Android Manifest for Biometrics
        # INDISPENSABLE : Injecte l'autorisation d'empreinte digitale dans le code natif
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.USE_BIOMETRIC" />' $MANIFEST
            echo "Android Manifest patched successfully."
          fi

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Release (APK)
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Sign Android Release
        # Cette étape ne s'exécute que si vous avez configuré vos secrets GitHub
        if: env.ANDROID_SIGNING_KEY != ''
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload APK Result
        # Récupère l'APK (signée ou non) et la rend téléchargeable sur GitHub
        uses: actions/upload-artifact@v4
        with:
          name: MUCODEC-Android-Release
          path: |
            android/app/build/outputs/apk/release/*.apk
