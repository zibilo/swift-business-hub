<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    
    <!-- DÉSACTIVATION DU ZOOM : On fixe l'échelle à 1.0 et on interdit l'utilisateur de zoomer -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <title>MUCODEC - Espace Entreprise</title>
    <meta name="description" content="Gestion sécurisée des flux de paie MUCODEC" />
    <meta name="author" content="MUCODEC" />

    <!-- OPTIMISATION PWA / MOBILE (Pour le fonctionnement hors-ligne) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#00204E"> <!-- Bleu institutionnel MUCODEC -->

    <!-- Open Graph (Partage reseaux sociaux) -->
    <meta property="og:title" content="MUCODEC Espace Entreprise" />
    <meta property="og:description" content="Transmettez vos fichiers de paie en toute sécurité." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/resources_electron/icon.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/resources_electron/icon.png" />

    <!-- STYLE CRITIQUE POUR LE HORS-LIGNE (Evite le flash blanc au démarrage) -->
    <style>
      html, body {
        background-color: #F8FAFC;
        margin: 0;
        padding: 0;
        /* Empêche les rebonds de défilement sur iOS */
        overscroll-behavior: none;
        /* Désactive la sélection de texte pour faire plus "App" */
        user-select: none;
        -webkit-user-select: none;
      }
      #root {
        height: 100vh;
        width: 100vw;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
